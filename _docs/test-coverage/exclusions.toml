[["org.spockframework.smoke.condition.ConditionEvaluation#top-level MethodCallExpression with safe operator (method condition)"]]
status = "not-applicable"
reason = "Relies on Groovy truth: a null result of a top-level method call is falsy and fails the condition; Kotlin's expect block requires a Boolean, so a nullable result does not type-check"

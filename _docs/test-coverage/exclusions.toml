[["org.spockframework.smoke.condition.ConditionEvaluation#TupleExpression"]]
status = "not-applicable"
reason = "Groovy's multiple assignment ((a, b) = [1, 2]) is an expression with a value; Kotlin destructuring declarations are statements and cannot appear in a condition"

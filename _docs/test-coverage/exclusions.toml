# Deliberate decisions not to port an upstream feature, and features that
# cannot be ported because they do not compile under Spockk.
#
# status = "not-applicable"  behavior that cannot exist in Kotlin. Permanent.
#                            Requires a reason. Reviewed like documentation.
# status = "blocked"         will not compile under Spockk today, so no test
#                            can be committed at all. Requires a gap issue.
#                            Temporary: delete the entry when the gap closes.
#
# A feature that compiles but fails at runtime does NOT belong here. It is
# committed with @PendingFeature instead (spec section 9).

[["org.spockframework.smoke.condition.ConditionRendering#renders GString diff"]]
status = "not-applicable"
reason = "Kotlin has no GString; string templates compile to concatenation"
decided = "2026-09-19"

[["org.spockframework.mock.AccessProtectedPropsSpec#Access protected fields Issue #1452"]]
status = "not-applicable"
reason = "Groovy's GroovyObject.getProperty lets a spec class read a protected field of an unrelated class dynamically; Kotlin enforces protected visibility at compile time, so `mySpy.nonStaticFlag`/`mySpy.staticFlag` from outside the class hierarchy does not compile"
decided = "2026-09-25"

[["org.spockframework.mock.AccessProtectedPropsSpec#Access protected fields without spy"]]
status = "not-applicable"
reason = "Same direct protected-property-access pattern as 'Access protected fields Issue #1452', minus the spy; does not compile under Kotlin's protected visibility rules"
decided = "2026-09-25"

[["org.spockframework.mock.AccessProtectedPropsSpec#Access protected fields should be accessible in Groovy 3&4 with Java class Issue #1501"]]
status = "not-applicable"
reason = "Exists upstream to contrast a Groovy-compiled subclass against a plain Java-compiled base class, isolating the GroovyObject.getProperty override bug (spockframework/spock#1501) to Groovy-compiled types. Kotlin classes never implement GroovyObject, so every Kotlin-based feature in this class is already the 'clean' non-Groovy case; a dedicated Java-class variant would only duplicate the other ported features without exercising a different code path"
decided = "2026-09-25"

[["org.spockframework.mock.AdditionalInterfaceResponseSpec#Defining responses for additionalInterfaces for Groovy class with GroovyStub"]]
status = "not-applicable"
reason = "GroovyStub/GroovyMock/GroovySpy exist to intercept dynamic Groovy-only behavior (metaclass dispatch) that a Groovy class or interface exposes; Kotlin classes never go through Groovy's metaclass, so GroovyStub has nothing Groovy-specific left to add over the plain Stub variant already ported from the same upstream class"
decided = "2026-10-09"

[["org.spockframework.mock.AdditionalInterfaceResponseSpec#Defining responses for additionalInterfaces for Groovy interface with GroovyStub"]]
status = "not-applicable"
reason = "Same reasoning as 'Defining responses for additionalInterfaces for Groovy class with GroovyStub': GroovyStub targets Groovy metaclass dispatch, which Kotlin types never go through"
decided = "2026-10-09"

[["org.spockframework.mock.AutoAttachInvalidUsageSpec#setup"]]
status = "not-applicable"
reason = "This is the class's setup fixture method, not a feature; its only content upstream is runner.addClassImport(AutoAttach), wiring the embedded Groovy compiler to resolve @AutoAttach inside the dynamically-compiled spec bodies the other features pass as strings. The Kotlin port uses real ahead-of-time-compiled fixture classes that import spock.mock.AutoAttach directly, so there is no dynamic-compilation import step to reproduce"
decided = "2026-09-27"

[["org.spockframework.mock.response.MockPrimitiveTypeResponsesSpec#Mock Response TypeArgumentConstraint with primitive type Issue #1974"]]
status = "blocked"
reason = "Spockk interactions only have the untyped any() wildcard; there is no equivalent of Spock's `_ as int` type constraint, which is what this feature tests"
gap = "https://github.com/pshevche/spockk/issues/684"
decided = "2026-10-06"

[["org.spockframework.mock.response.MockPrimitiveTypeResponsesSpec#Mock Response TypeArgumentConstraint with different primitive types Issue #1974"]]
status = "blocked"
reason = "Needs the same `_ as int` type constraint as the sibling feature; it also calls an Int-taking method with a Double and a Boolean, which Kotlin's static typing rejects, so the port will need a differently typed target once the gap is closed"
gap = "https://github.com/pshevche/spockk/issues/684"
decided = "2026-10-06"

[["org.spockframework.mock.DetachedMockFactorySpec#can spy on instances of classes with no default constructor"]]
status = "blocked"
reason = "Needs given:/expect: (checks the spy forwards to the real getter) followed by when:/then: (overrides the call via an interaction and re-checks). Spockk's block-order validator only allows 'and'/'cleanup'/'where' after 'expect:', rejecting 'when:', even though real Spock's BlockParseInfo.EXPECT explicitly allows a following WHEN"
gap = "https://github.com/pshevche/spockk/issues/665"
decided = "2026-09-29"

[["org.spockframework.runtime.ClosingOfDataProviders#close one provider which potentially throws an exception"]]
status = "not-applicable"
reason = "Upstream marks the whole class @Ignore (\"Method removed from PlatformParameterizedSpecRunner\"): it calls PlatformParameterizedSpecRunner.closeDataProviders, which no longer exists, so the feature never runs upstream. Spockk reuses Spock's own runner unchanged and has no equivalent code path to port"
decided = "2026-10-13"

[["org.spockframework.runtime.ClosingOfDataProviders#close multiple providers which potentially throw an exception"]]
status = "not-applicable"
reason = "Same as 'close one provider which potentially throws an exception': the class is @Ignore'd upstream because closeDataProviders was removed from PlatformParameterizedSpecRunner, so there is no behavior left to cover"
decided = "2026-10-13"

[["org.spockframework.runtime.RunContextEmbeddedSpec#initial run context is named 'default'"]]
status = "blocked"
reason = "Checks the run context in expect:, then runs a nested spec in when:/then:. Spockk's block-order validator only allows 'and'/'cleanup'/'where' after 'expect:', rejecting 'when:', even though real Spock's BlockParseInfo.EXPECT allows a following WHEN. The nested run's name 'default/EmbeddedSpecRunner' is also specific to Spock's embedded runner, so the port needs a rethink once the gap closes"
gap = "https://github.com/pshevche/spockk/issues/665"


[versions]
auto-service = "1.1.1"
junit = "6.1.3"
kotlin = "2.4.10"
spock = "2.4-groovy-5.0"

[plugins]
buildconfig = { id = "com.github.gmazzo.buildconfig", version = "6.0.10" }
detekt = { id = "io.gitlab.arturbosch.detekt", version = "1.23.8" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version = "2.18.1" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
node = { id = "com.github.node-gradle.node", version = "7.1.0" }
plugin-publish = { id = "com.gradle.plugin-publish", version = "2.1.1" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
spotless = { id = "com.diffplug.spotless", version = "8.10.1" }

[libraries]
google-autoservice = { module = "com.google.auto.service:auto-service", version.ref = "auto-service" }
google-autoservice-annotations = { module = "com.google.auto.service:auto-service-annotations", version.ref = "auto-service" }
hamcrest = { module = "org.hamcrest:hamcrest", version = "3.0" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
junit-platform-testkit = { module = "org.junit.platform:junit-platform-testkit", version.ref = "junit" }
junit4 = { module = "junit:junit", version = "4.13.2" }

kotlin-compile-testing = { module = "dev.zacsweers.kctfork:core", version = "0.13.0" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
spock = { module = "org.spockframework:spock-core", version.ref = "spock" }
spock-junit4 = { module = "org.spockframework:spock-junit4", version.ref = "spock" }
mockito = { module = "org.mockito:mockito-core", version = "5.23.0" }

name: "Set up pnpm"
description: "Install pnpm and Node.js for building spockk-docs"

runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: spockk-docs/package.json

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: spockk-docs/pnpm-lock.yaml

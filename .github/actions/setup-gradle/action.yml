name: "Set up Gradle"
description: "Checkout repository, configure JDK and Gradle"

runs:
  using: "composite"
  steps:
    - name: Setup Java 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Setup Java 25
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 25
    - name: Set JDK environment variables
      shell: bash
      run: |
        echo "JDK21=$JAVA_HOME_21_X64" >> $GITHUB_ENV
        echo "JDK25=$JAVA_HOME_25_X64" >> $GITHUB_ENV
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    - name: Detect whether running on a PR from a fork
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "IS_FORK=true" >> $GITHUB_ENV
          else
            echo "IS_FORK=false" >> $GITHUB_ENV
          fi
        else
          if [ "${{ github.event.repository.fork }}" = "true" ]; then
            echo "IS_FORK=true" >> $GITHUB_ENV
          else
            echo "IS_FORK=false" >> $GITHUB_ENV
          fi
        fi
